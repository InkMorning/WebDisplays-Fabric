buildscript {
    repositories {
        maven { name = 'aliyun-public'; url = 'https://maven.aliyun.com/repository/public' }
        maven { name = 'fabricmc'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${property('loom_version')}"
    }
}

apply plugin: 'java'
apply plugin: 'fabric-loom'

group = maven_group
version = mod_version
base { archivesName = archives_base_name }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    maven { name = 'aliyun-public'; url = 'https://maven.aliyun.com/repository/public' }
    maven { name = 'fabricmc'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { name = 'minecraft-libraries'; url = 'https://libraries.minecraft.net/' }
    maven { name = 'cinemamod'; url = 'https://mcef-download.cinemamod.com/repositories/releases' }
    maven { name = 'shedaniel'; url = 'https://maven.shedaniel.me/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "com.cinemamod:mcef-fabric:${mcef_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/webdisplays.accesswidener')

    runs {
        client {
            vmArg '-Dfabric.debug.logRequests=true'
        }
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'WebDisplays',
                'Implementation-Vendor': 'CinemaMod Group'
    }
}
